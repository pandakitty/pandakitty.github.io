    <style>
        :root { 
            --primary: #FAFAFA; 
            --secondary: #F0F0F0; 
            --accent: #555555; 
            --bg: #FAFAFA; 
            --text: #333333; 
            --muted: #666666;
            --white: #0A0A0A; 
            --border: #0A0A0A;
        }
        body { font-family: 'Inter', sans-serif; line-height: 1.6; color: var(--text); background-color: var(--bg); margin: 0; }
        header { background: var(--secondary); border-bottom: 2px solid var(--border); color: var(--white); padding: 40px 20px; text-align: center; }
        header h1 { letter-spacing: 0.15em; font-weight: 800; margin: 0; font-size: 1.8rem; text-transform: uppercase; }
        nav { background: var(--secondary); border-bottom: 2px solid var(--border); padding: 1rem; text-align: center; position: sticky; top: 0; z-index: 1000; }
        nav a { margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text); transition: color 0.2s; }
        nav a:hover { color: var(--white); }
        .container { max-width: 600px; margin: 50px auto; padding: 40px; background: var(--primary); border: 2px solid var(--border); border-radius: 0px; text-align: center; box-shadow: 4px 4px 0px 0px rgba(10,10,10,1); }
        .container h2 { color: var(--white); letter-spacing: 0.1em; margin-top: 0; text-transform: uppercase; font-size: 1.2rem; }
        .container p { color: var(--muted); font-size: 0.9rem; letter-spacing: 0.05em; }
        
        /* Hard-edged Obsidian Button Styles */
        .btn { display: inline-block; margin: 10px; padding: 14px 24px; background: var(--white); color: var(--primary); text-decoration: none; border-radius: 0px; border: 2px solid var(--border); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; transition: all 0.2s; }
        .btn:hover { background: var(--accent); color: var(--primary); transform: translate(-2px, -2px); box-shadow: 3px 3px 0px 0px rgba(10,10,10,1); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--white); }
        .btn-outline:hover { background: var(--white); color: var(--primary); }
        
        .button-stack { display: flex; flex-direction: column; gap: 14px; align-items: center; margin-top: 30px; }
        .fixed-width { width: 280px; }
    </style>
</head>
