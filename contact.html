<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ashley Love</title>
    <style>
        :root { 
            --primary: #FAFAFA; 
            --secondary: #F0F0F0; 
            --accent: #555555; 
            --bg: #FAFAFA; 
            --text: #333333; 
            --muted: #666666;
            --white: #0A0A0A; 
            --border: #0A0A0A;
        }
        body { font-family: 'Inter', sans-serif; line-height: 1.6; color: var(--text); background-color: var(--bg); margin: 0; }
        header { background: var(--secondary); border-bottom: 2px solid var(--border); color: var(--white); padding: 40px 20px; text-align: center; }
        header h1 { letter-spacing: 0.15em; font-weight: 800; margin: 0; font-size: 1.8rem; text-transform: uppercase; }
        nav { background: var(--secondary); border-bottom: 2px solid var(--border); padding: 1rem; text-align: center; position: sticky; top: 0; z-index: 1000; }
        nav a { margin: 0 15px; text-decoration: none; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text); transition: color 0.2s; }
        nav a:hover { color: var(--white); }
        .container { max-width: 600px; margin: 50px auto; padding: 40px; background: var(--primary); border: 2px solid var(--border); border-radius: 0px; text-align: center; box-shadow: 4px 4px 0px 0px rgba(10,10,10,1); }
        .container h2 { color: var(--white); letter-spacing: 0.1em; margin-top: 0; text-transform: uppercase; font-size: 1.2rem; }
        .container p { color: var(--muted); font-size: 0.9rem; letter-spacing: 0.05em; }
        
        /* Form Styles */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; text-transform: uppercase; font-family: monospace; margin-bottom: 5px; color: var(--text); font-weight: bold; }
        .form-control { width: 100%; padding: 12px; background: var(--secondary); border: 1.5px solid var(--border); font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--text); outline: none; box-sizing: border-box; }
        .form-control:focus { border-color: var(--accent); }

        /* Hard-edged Obsidian Button Styles */
        .btn { display: inline-block; margin: 10px 0; padding: 14px 24px; background: var(--white); color: var(--primary); text-decoration: none; border-radius: 0px; border: 2px solid var(--border); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; transition: all 0.2s; cursor: pointer; width: 100%; box-sizing: border-box; box-shadow: 3px 3px 0px 0px rgba(85,85,85,1); }
        .btn:hover { background: var(--accent); color: var(--primary); transform: translate(-2px, -2px); box-shadow: 5px 5px 0px 0px rgba(10,10,10,1); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--white); box-shadow: none; }
        .btn-outline:hover { background: var(--white); color: var(--primary); box-shadow: 3px 3px 0px 0px rgba(10,10,10,1); }
        
        .button-stack { display: flex; flex-direction: column; gap: 14px; align-items: center; margin-top: 30px; }
        .fixed-width { width: 100%; max-width: 280px; }
    </style>
</head>
<body>
    <header><h1>Get In Touch</h1></header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>

    </nav>
    
    <div class="container">

        <p>Seeking Lead UI Engineering & Data Science Opportunities for 2026</p>
        
        <!-- Direct Message Form Connected via Formspree -->

            <div class="form-group">
                <label>Your Email</label>
                <input type="email" name="email" required class="form-control" placeholder="recruiter@company.com">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea name="message" rows="4" required class="form-control" placeholder="Let's discuss a Lead UI / Data Science role..." style="resize: vertical;"></textarea>
            </div>

            <button type="submit" class="btn">
                Send Message &rarr;
            </button>
        </form>
        
        <div class="button-stack">
            <!-- Fixed Resume Download Link -->
            <a href="ashley_love_RESUME.pdf" download="Ashley_Love_Resume.pdf" class="btn btn-outline fixed-width" style="text-align: center;">📄 Download Resume (PDF)</a>
            
            <a href="https://linkedin.com/in/ashe-love/" target="_blank" class="btn btn-outline fixed-width" style="text-align: center;">🔗 LinkedIn Profile</a>
            
            <a href="https://github.com/pandakitty" target="_blank" class="btn btn-outline fixed-width" style="text-align: center;">💻 GitHub Portfolio</a>
        </div>

        <p style="margin-top: 35px; font-size: 0.8rem; color: var(--muted); border-top: 2px solid var(--border); padding-top: 20px; letter-spacing: 0.1em; text-transform: uppercase; text-align: center;">
            Direct Email: <strong style="color: var(--white);">ashelove6969@gmail.com</strong>
        </p>
    </div>

    <footer style="text-align: center; padding: 40px; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;">
        &copy; 2026 Ashley Love | Obsidian & Chrome Architecture
    </footer>
</body>
</html>
