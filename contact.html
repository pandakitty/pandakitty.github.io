        :root {

            --text: #E0E0E0; 
            --muted: #888888;
            --white: #FFFFFF;

        body { font-family: 'Inter', sans-serif; line-height: 1.6; color: var(--text); background-color: var(--bg); margin: 0; }
        header { background: var(--secondary); border-bottom: 1px solid var(--border); color: var(--white); padding: 40px 20px; text-align: center; }
        header h1 { letter-spacing: 0.1em; font-weight: 800; margin: 0; font-size: 1.8rem; }
        nav { background: var(--secondary); border-bottom: 1px solid var(--border); padding: 1rem; text-align: center; position: sticky; top: 0; z-index: 1000; }

        .container { max-width: 600px; margin: 40px auto; padding: 40px; background: var(--secondary); border: 1px solid var(--border); border-radius: 4px; text-align: center; }
        .container h2 { color: var(--white); letter-spacing: 0.05em; margin-top: 0; }
        .container p { color: var(--muted); font-size: 0.95rem; }
        
        /* Button Styles */
        .btn { display: inline-block; margin: 10px; padding: 12px 24px; background: var(--white); color: var(--primary); text-decoration: none; border-radius: 2px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; transition: background 0.2s, transform 0.2s; }
        .btn:hover { background: var(--accent); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--white); }
        .btn-outline:hover { background: var(--accent); color: var(--primary); }
        
        .button-stack { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 30px; }
        .fixed-width { width: 260px; }
    </style>
